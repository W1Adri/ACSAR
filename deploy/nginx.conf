# Configuració d'exemple per servir el lloc estàtic amb nginx.
# Copia dist/ a /var/www/acsar i aquest fitxer a /etc/nginx/sites-available/acsar.
#
#   sudo ln -s /etc/nginx/sites-available/acsar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificat TLS es pot emetre amb:  sudo certbot --nginx -d acsar.tech -d www.acsar.tech

server {
    listen 80;
    listen [::]:80;
    server_name acsar.tech www.acsar.tech;
    return 301 https://acsar.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.acsar.tech;

    ssl_certificate     /etc/letsencrypt/live/acsar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acsar.tech/privkey.pem;

    return 301 https://acsar.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acsar.tech;

    root /var/www/acsar;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/acsar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acsar.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Capçaleres de seguretat
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Ajusta la CSP si s'afegeixen scripts o serveis externs.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; form-action https://formspree.io; base-uri 'self'; frame-ancestors 'self'" always;

    # Astro genera carpetes amb index.html: /missio/ → /missio/index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Els fitxers amb hash al nom es poden cachejar per sempre
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;
}
